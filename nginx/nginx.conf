# Docker's embedded DNS server — used to re-resolve service names at
# request time instead of once at nginx startup. Without this, nginx
# caches whatever IP a container had when nginx first started, and
# keeps proxying to that stale IP after the container is recreated
# (e.g. on `docker compose up` rebuilding frontend/backend), causing
# 502 Bad Gateway until nginx is manually restarted.
resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    # API requests → Go backend
    location /api/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Everything else → React frontend
    location / {
        set $frontend_upstream http://frontend:80;
        proxy_pass $frontend_upstream;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
